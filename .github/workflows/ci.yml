name: ci
on:
  push: {branches: [main]}
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: agent, POSTGRES_PASSWORD: agent, POSTGRES_DB: agent}
        ports: ["55434:5432"]
        options: --health-cmd "pg_isready -U agent" --health-interval 2s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["56381:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 20
    env:
      AGENTPLAT_TEST_PG_URL: postgresql+asyncpg://agent:agent@localhost:55434/agent
      AGENTPLAT_TEST_REDIS_URL: redis://localhost:56381/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest -q -m integration
      - name: migrations round-trip on real Postgres (empty -> head -> base -> head)
        run: |
          uv run agentplat-db upgrade --url "$AGENTPLAT_TEST_PG_URL"
          uv run agentplat-db downgrade base --url "$AGENTPLAT_TEST_PG_URL"
          uv run agentplat-db upgrade --url "$AGENTPLAT_TEST_PG_URL"

  eval-smoke:
    # Regression gate on runtime safety behaviour (offline model, no API keys, no cost).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run agent-eval run suites/smoke.yaml --min-pass-rate 1.0 --out eval-out
      - uses: actions/upload-artifact@v4
        with: {name: eval-smoke-report, path: eval-out/}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}  # gitleaks scans the pushed commit range; a shallow clone lacks it
      - run: docker build -t agentplat:ci .
      - name: secret scan
        uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
